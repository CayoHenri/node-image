name: CD - Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/cd-ecr.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-ecr
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::081473213177:role/GitHubActions-ECR-NodeImage-Push
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            081473213177.dkr.ecr.us-east-1.amazonaws.com/node-image:latest
            081473213177.dkr.ecr.us-east-1.amazonaws.com/node-image:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
